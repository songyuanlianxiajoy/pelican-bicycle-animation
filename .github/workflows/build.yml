name: Build SVG

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SVG XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('pelican-bicycle.svg')"
      - name: Verify responsive SVG metadata
        run: |
          grep -q 'viewBox="0 0 360 640"' pelican-bicycle.svg
          grep -q 'prefers-reduced-motion' pelican-bicycle.svg
      - name: Upload SVG artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelican-bicycle-svg
          path: pelican-bicycle.svg

      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
